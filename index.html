<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NobsFS Autopilot</title>
    <!-- Paint the dark theme background before any JS loads, so WebView2's
         initial surface isn't white on launch. Literal mirror of the `--bg`
         token (palette.background.default); the CSS vars aren't injected until
         main.tsx runs. -->
    <style>
      html,
      body {
        background: #171f24;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Global SVG filter: a mild unsharp-mask convolution (kernel sums to 1, so
         brightness is preserved) referenced by the product images. They're large
         photos drawn into small cells, and on 1x displays that heavy downscale
         goes soft; this restores crisp edges without the haloing a stronger
         kernel would add. Lives here so the single `#nobs-img-sharpen` id is
         always in the document for CSS `filter: url(...)` to resolve. -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <filter id="nobs-img-sharpen">
        <feConvolveMatrix order="3" preserveAlpha="true"
          kernelMatrix="0 -0.1 0  -0.1 1.4 -0.1  0 -0.1 0" />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
